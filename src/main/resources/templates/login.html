<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In - Campus Social Network</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        }
        .brand {
            font-size: 0.85rem;
            font-weight: 600;
            color: #2563eb;
            margin-bottom: 6px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 6px;
        }
        .subtitle {
            color: #475569;
            font-size: 0.92rem;
            margin-bottom: 20px;
        }
        .alert {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.88rem;
            margin-bottom: 16px;
        }
        .alert-error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        .alert-success {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #1e293b;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #0f172a;
        }
        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        button {
            width: 100%;
            padding: 11px 16px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
        }
        button:hover {
            background: #1d4ed8;
        }
        .footer-link {
            margin-top: 18px;
            text-align: center;
            font-size: 0.88rem;
            color: #475569;
        }
        .footer-link a {
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
        }
        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="brand">University Network</div>
    <h1>Sign in</h1>
    <p class="subtitle">Access your campus feed, friends, and posts.</p>

    <div th:if="${param.error}" class="alert alert-error">
        Invalid email or password. Please try again.
    </div>
    <div th:if="${param.logout}" class="alert alert-success">
        You have been signed out.
    </div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="email">University Email</label>
            <input id="email" name="username" type="email" required autofocus placeholder="student@university.edu" />
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required placeholder="Enter your password" />
        </div>
        <button type="submit">Sign In</button>
    </form>

    <div class="footer-link">
        New to the network? <a th:href="@{/register}">Create an account</a>
    </div>
</div>
</body>
</html>
