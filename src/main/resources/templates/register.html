<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Campus Social Network</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        }
        .brand {
            font-size: 0.85rem;
            font-weight: 600;
            color: #2563eb;
            margin-bottom: 6px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 6px;
        }
        .subtitle {
            color: #475569;
            font-size: 0.92rem;
            margin-bottom: 20px;
        }
        .alert-error {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.88rem;
            margin-bottom: 16px;
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #1e293b;
        }
        input, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            color: #0f172a;
        }
        textarea {
            min-height: 76px;
            resize: vertical;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        button {
            width: 100%;
            padding: 11px 16px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
        }
        button:hover {
            background: #1d4ed8;
        }
        .footer-link {
            margin-top: 18px;
            text-align: center;
            font-size: 0.88rem;
            color: #475569;
        }
        .footer-link a {
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
        }
        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="brand">University Network</div>
    <h1>Create student account</h1>
    <p class="subtitle">Join discussions and connect with classmates.</p>

    <div th:if="${errorMessage}" class="alert-error" th:text="${errorMessage}"></div>

    <form th:action="@{/register}" method="post">
        <div class="row">
            <div class="form-group">
                <label for="firstName">First Name</label>
                <input id="firstName" name="firstName" type="text" required placeholder="Alice" />
            </div>
            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input id="lastName" name="lastName" type="text" required placeholder="Smith" />
            </div>
        </div>

        <div class="form-group">
            <label for="email">University Email</label>
            <input id="email" name="email" type="email" required placeholder="alice@university.edu" />
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required minlength="6" placeholder="Create a password" />
        </div>

        <div class="row">
            <div class="form-group">
                <label for="faculty">Faculty</label>
                <input id="faculty" name="faculty" type="text" required placeholder="Computing" />
            </div>
            <div class="form-group">
                <label for="studyYear">Study Year</label>
                <input id="studyYear" name="studyYear" type="number" min="1" max="8" required placeholder="2" />
            </div>
        </div>

        <div class="form-group">
            <label for="bio">Bio (Optional)</label>
            <textarea id="bio" name="bio" placeholder="Tell classmates about your courses or interests..."></textarea>
        </div>

        <button type="submit">Register</button>
    </form>

    <div class="footer-link">
        Already have an account? <a th:href="@{/login}">Sign in</a>
    </div>
</div>
</body>
</html>
